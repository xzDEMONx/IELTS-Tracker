    q('#neFiles').innerHTML = [...d.files.map(f=>({k:'old',id:f.id,name:f.name,size:f.size,type:f.type})), ...pending.map((p,i)=>({k:'new',id:i,name:p.file.name,size:p.file.size,type:p.file.type||''}))].map(f=>`
      <div class="nerow">${icon(fileIcon(f.type),16)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${esc(f.name)}</span><span class="sub">${fmtSize(f.size)}</span>
      <button type="button" class="ico del" data-fk="${f.k}:${esc(f.id)}" title="Remove">${icon('x',16)}</button></div>`).join('');
    q('#neFiles').querySelectorAll('[data-fk]').forEach(b => b.onclick = () => {
      const [k,fid] = b.dataset.fk.split(':');
      if(k==='old'){ d.files = d.files.filter(f=>f.id!==fid); removed.push(fid); } else pending.splice(+fid,1);
      drawFiles();
    });
  };
  drawChecks(); drawColors(); drawFiles();
  q('#neAdd').onclick = addCheck;
  q('#neNew').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); addCheck(); } };
  q('#neAttach').onclick = () => q('#neFile').click();
  q('#neFile').onchange = e => { [...e.target.files].forEach(file => pending.push({id:newFid(), file})); e.target.value = ''; drawFiles(); };
  q('#neCancel').onclick = () => back.remove();
  form.onsubmit = async e => {
    e.preventDefault();
    d.title = form.elements.title.value.trim(); d.desc = form.elements.desc.value.trim();
    if(!d.title){ q('#neErr').textContent = 'Please write a title.'; form.elements.title.focus(); return; }
    try{
      for(const pf of pending){ await FDB.put(pf.id, pf.file); d.files.push({id:pf.id, name:pf.file.name, type:pf.file.type||'application/octet-stream', size:pf.file.size}); }
      for(const fid of removed) await FDB.del(fid).catch(()=>{});
    }catch(err){ q('#neErr').textContent = 'Could not store the files in this browser. Try smaller files.'; return; }
    d.updated = Date.now();
    if(ex) Object.assign(ex, d); else state.notes.push(d);
    save(); back.remove(); if(current==='notes') viewNotes($('view')); toast('Saved');
  };
  form.elements.title.focus();
}

/* ================= Oxford words page ================= */
let oxF = 'all', oxEdit = -1, oxTry = '', oxRefQ = '', oxRefF = 'all', oxRefLimit = 300;
function lev(a,b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur = [i]; for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev = cur; }
  return prev[n];
}
function oxSuggest(word){
  const n = norm(word); if(!n) return [];
  const lim = n.length <= 4 ? 1 : 2, out = [];
  for(const k in state.oxford){ if(Math.abs(k.length-n.length) > lim) continue; const dd = lev(n,k); if(dd>0 && dd<=lim) out.push([dd,k]); }
  out.sort((x,y)=>x[0]-y[0] || x[1].localeCompare(y[1]));
  return out.slice(0,3).map(x=>x[1]);
}
function oxResultHtml(word){
  if(!word.trim()) return '';
  const r = oxCheck(word);
  if(!r.loaded) return `<span class="ox none">Load the Oxford lists above to check words.</span>`;
  if(r.found) return `<span class="ox yes">${icon('checkc',16)} Correct — in the Oxford ${r.t}${r.exact?'':` (as “${esc(r.key)}”)`}</span>`;
  const sg = oxSuggest(word);
  return `<span class="ox bad">${icon('x',16)} Not found — check the spelling</span>${sg.length?` <span class="sub">Did you mean:</span> ${sg.map(x=>`<button type="button" class="sug" data-try="${esc(x)}">${esc(x)}</button>`).join('')}`:''}`;
}
function oxPanelHtml(){
  const oc = oxCounts();
  return `<details class="card" id="oxp" style="margin-bottom:16px" ${(!oc.n||oxOpen)?'open':''}>
    <summary>${icon('checkc',17)} Load the Oxford 3000 &amp; 5000 lists <span class="sub">${oc.n?`${oc.a} words in the 3000 · ${oc.b} more in the 5000`:'not loaded yet'}</span></summary>
    <div class="stack">
      <div class="sub">Load the lists once so the app can check your spelling. Open
        <a href="https://www.oxfordlearnersdictionaries.com/wordlists/oxford3000-5000" target="_blank" rel="noopener" style="color:var(--accent)">Oxford Learner's Dictionaries</a>,
        copy a list, choose which list it is, and paste it here. You can also upload a .txt or .csv file. Labels like “noun A1” are removed automatically.</div>
      <div class="seg" id="oxSeg"><button data-l="3" class="${oxSel==='3'?'on':''}">Oxford 3000</button><button data-l="5" class="${oxSel==='5'?'on':''}">Oxford 5000</button></div>
      <textarea class="input" id="oxPaste" rows="5" placeholder="Paste the list here…"></textarea>
      <div class="row">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" id="oxImport">${icon('upload',16)} Load list</button>
          <button class="btn" id="oxFileBtn">${icon('download',16)} Upload file</button>
          <input type="file" id="oxFile" accept=".txt,.csv,text/plain,text/csv" hidden>
        </div>
        ${oc.n?'<button class="btn danger" id="oxClear">Clear Oxford lists</button>':''}
      </div>
      <div class="sub" id="oxMsg">${esc(oxNote)}</div>
    </div></details>`;
}
function bindOxPanel(rerender){
  $('oxp').ontoggle = () => { oxOpen = $('oxp').open; };
  $('oxSeg').onclick = e => { const b = e.target.closest('button'); if(!b) return; oxSel = b.dataset.l;
    $('oxSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); };
  const doImport = text => {
    if(!text.trim()){ $('oxMsg').textContent = 'Paste a list first.'; return; }
    const r = importOxford(text, oxSel);
    oxNote = r.total ? `Loaded ${r.added} new word${r.added===1?'':'s'} into the Oxford ${oxSel==='3'?3000:5000} list (${r.total} read).` : 'No words found in that text.';
    oxOpen = true; rerender();
  };
  $('oxImport').onclick = () => doImport($('oxPaste').value);
  $('oxFileBtn').onclick = () => $('oxFile').click();
  $('oxFile').onchange = e => { const file = e.target.files[0]; if(!file) return;
    const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(file); e.target.value = ''; };
  if($('oxClear')) $('oxClear').onclick = () => { if(confirm('Remove the loaded Oxford lists? Your own words are not touched.')){ state.oxford = {}; oxNote = 'Oxford lists cleared.'; save(); rerender(); } };
}
function drawOxChips(){
  const box = $('oxChips'); if(!box) return;
  const mine = new Set(state.words.map(x=>norm(x.w))), q = norm(oxRefQ);
  const keys = Object.keys(state.oxford).filter(k => (oxRefF==='all' || state.oxford[k]===oxRefF) && (!q || k.includes(q))).sort();
  const shown = keys.slice(0, oxRefLimit);
  box.innerHTML = `<div class="sub" style="margin-bottom:8px">${keys.length} word${keys.length===1?'':'s'} · <span style="color:var(--ok);font-weight:600">green</span> = already in my list</div>
    <div class="chips">${shown.map(k=>`<span class="rchip ${mine.has(k)?'mine':''}">${esc(k)}</span>`).join('') || '<span class="sub">No words match.</span>'}</div>
    ${keys.length>oxRefLimit?`<div style="margin-top:12px"><button class="btn" id="oxRefMore">Show more (${keys.length-oxRefLimit} left)</button></div>`:''}`;
  if($('oxRefMore')) $('oxRefMore').onclick = () => { oxRefLimit += 300; drawOxChips(); };
}
function renderOxRef(){
  const box = $('oxref'); if(!box) return;
  const oc = oxCounts(), show = !!state.settings.oxShow;
  box.innerHTML = `
    <div class="row"><div><h3>Oxford word list</h3><div class="sub">${oc.n?`${oc.a} words in the 3000 · ${oc.b} more in the 5000`:'not loaded yet'}</div></div>
      <button class="btn" id="oxEye" title="${show?'Hide the list':'Show the list'}">${icon(show?'eyeoff':'eye',17)} ${show?'Hide words':'Show words'}</button></div>
    ${!oc.n ? `<div class="sub" style="padding-top:10px">Load the Oxford lists above to see the words here.</div>`
      : !show ? `<div class="sub" style="padding-top:10px">The list is hidden. Press the eye to see all ${oc.n} words.</div>`
      : `<div class="toolbar" style="margin-top:12px"><input class="input" id="oxRefQ" dir="auto" placeholder="Search the Oxford list…" value="${esc(oxRefQ)}" autocomplete="off">
          <div class="seg" id="oxRefF"><button data-f="all" class="${oxRefF==='all'?'on':''}">All</button><button data-f="3" class="${oxRefF==='3'?'on':''}">3000</button><button data-f="5" class="${oxRefF==='5'?'on':''}">5000</button></div></div>
         <div id="oxChips"></div>`}`;
  $('oxEye').onclick = () => { state.settings.oxShow = !state.settings.oxShow; save(); renderOxRef(); };
  if(oc.n && show){
    drawOxChips();
    $('oxRefQ').oninput = e => { oxRefQ = e.target.value; oxRefLimit = 300; drawOxChips(); };
    $('oxRefF').onclick = e => { const b = e.target.closest('button'); if(!b) return; oxRefF = b.dataset.f; oxRefLimit = 300;
      $('oxRefF').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); drawOxChips(); };
  }
}
function oxTile(x,i){
  const r = oxCheck(x.w), cls = !r.loaded ? '' : r.found ? 'ok' : 'bad';
  if(oxEdit===i) return `<form class="otile ${cls}" data-oxe="${i}">
    <input class="input" name="w" value="${esc(x.w)}" autocomplete="off" style="width:100%">
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" type="submit">${icon('check',15)} Check</button><button type="button" class="btn" data-oxc="1">Cancel</button></div></form>`;
  const sg = (r.loaded && !r.found) ? oxSuggest(x.w) : [];
  return `<div class="otile ${cls}">
    <div class="row" style="flex-wrap:nowrap;gap:8px"><span class="ow">${esc(x.w)}${r.found?`<span class="okc">${icon('checkc',17)}</span>`:''}${r.loaded&&!r.found?`<span class="xc">${icon('x',17)}</span>`:''}</span>
      <button class="ico" data-oxi="${i}" title="Type it again">${icon('edit',16)}</button></div>
    ${x.m?`<div class="wmean" dir="auto">${esc(x.m)}</div>`:''}
    ${r.found?`<div style="color:var(--ok);font-weight:600;font-size:13px;margin-top:4px">Correct · Oxford ${r.t}</div>`:''}
    ${r.loaded&&!r.found?`<div style="color:var(--danger);font-weight:600;font-size:13px;margin-top:4px">Not found — check the spelling</div>${sg.length?`<div style="margin-top:6px"><span class="sub">Did you mean:</span> ${sg.map(w=>`<button class="sug" data-fix="${i}:${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}`:''}
  </div>`;
}
function viewOxford(el){
  const loaded = oxLoaded();
  const rows = state.words.map((x,i)=>({x,i,r:oxCheck(x.w)}));
  const ok = rows.filter(r=>r.r.found).length, bad = loaded ? rows.length - ok : 0;
  const shown = rows.filter(r => oxF==='all' || (oxF==='ok' && r.r.found) || (oxF==='bad' && loaded && !r.r.found));
  el.innerHTML = `
  <div class="page-head"><div><h2>Oxford words</h2><div class="sub">Green = spelled correctly (found in the Oxford lists) · Red = not found · No colour = not checked yet</div></div></div>
  ${oxPanelHtml()}
  <div class="card" id="oxref" style="margin-bottom:16px"></div>
  <div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:8px">Check a word</h3>
    <input class="input" id="oxTry" dir="auto" autocomplete="off" placeholder="Type a word to test your spelling" style="width:100%" value="${esc(oxTry)}">
    <div id="oxTryRes" style="margin-top:10px;min-height:28px">${oxResultHtml(oxTry)}</div></div>
  <div class="stats">
    <div class="st"><span>My words</span><b>${rows.length}</b></div>
    <div class="st"><span>Correct</span><b style="color:var(--ok)">${loaded?ok:'–'}</b></div>
    <div class="st"><span>Need fixing</span><b style="color:var(--danger)">${loaded?bad:'–'}</b></div>
  </div>
  <div class="toolbar"><div class="seg" id="oxFilter">
    <button data-f="all" class="${oxF==='all'?'on':''}">All</button><button data-f="ok" class="${oxF==='ok'?'on':''}">Correct</button><button data-f="bad" class="${oxF==='bad'?'on':''}">Wrong</button></div></div>
  <div class="otiles" id="otiles">${shown.map(r=>oxTile(r.x,r.i)).join('') || `<div class="card empty" style="grid-column:1/-1">${rows.length?'No words in this filter.':'No words yet. Add words in Vocabulary and they will appear here.'}</div>`}</div>`;
  bindOxPanel(() => viewOxford(el));
  renderOxRef();
  const tryRes = () => { $('oxTryRes').innerHTML = oxResultHtml(oxTry); };
  $('oxTry').oninput = e => { oxTry = e.target.value; tryRes(); };
  $('oxTryRes').onclick = e => { const b = e.target.closest('[data-try]'); if(b){ oxTry = b.dataset.try; $('oxTry').value = oxTry; tryRes(); } };
  $('oxFilter').onclick = e => { const b = e.target.closest('button'); if(b){ oxF = b.dataset.f; viewOxford(el); } };
  const apply = (i,w) => {
    w = w.trim().replace(/\s+/g,' '); if(!w) return false;
    const dup = state.words.findIndex((x,k) => x.w.toLowerCase()===w.toLowerCase() && k!==i);
    if(dup>=0){ alert(`“${w}” is already in your list (#${dup+1}).`); return false; }
    state.words[i].w = w; save();
    const r = oxCheck(w); toast(!r.loaded ? 'Saved' : r.found ? 'Correct — turned green' : 'Still not found in Oxford');
    return true;
  };
  $('otiles').onclick = e => {
    const ed = e.target.closest('[data-oxi]'), fx = e.target.closest('[data-fix]'), cn = e.target.closest('[data-oxc]');
    if(ed){ oxEdit = +ed.dataset.oxi; viewOxford(el); const inp = el.querySelector('form[data-oxe] input'); if(inp){ inp.focus(); inp.select(); } }
    else if(cn){ oxEdit = -1; viewOxford(el); }
    else if(fx){ const [i,w] = fx.dataset.fix.split(':'); if(apply(+i,w)) viewOxford(el); }
  };
  el.querySelectorAll('form[data-oxe]').forEach(fm => { fm.onsubmit = e => { e.preventDefault(); const i = +fm.dataset.oxe; if(apply(i, fm.elements.w.value)){ oxEdit = -1; viewOxford(el); } }; });
}

/* ================= settings ================= */
function viewSettings(el){
  const S = state.settings;
  el.innerHTML = `
  <div class="page-head"><div><h2>Settings</h2><div class="sub">Everything here is saved the moment you change it.</div></div></div>
  <div class="card" style="margin-bottom:16px">
    <h3>Profile & goals</h3>
    <div class="set"><div><b>Your name</b><span class="sub">Used in your welcome message. More details are in <a href="#profile" style="color:var(--accent)">My profile</a>.</span></div><input class="input" id="sName" value="${esc(state.profile.name)}" placeholder="Name" style="width:200px"></div>
    <div class="set"><div><b>Daily word goal</b><span class="sub">New words you want to add each day</span></div><input class="input" id="sGoal" type="number" min="1" max="500" value="${S.wordGoal}" style="width:100px"></div>
    <div class="set"><div><b>Total word target</b><span class="sub">8000 = Oxford 3000 + 5000. You can change it.</span></div><input class="input" id="sTarget" type="number" min="1" max="20000" value="${S.wordTarget}" style="width:100px"></div>
    <div class="set"><div><b>Test date</b><span class="sub">${state.test?esc(niceDate(state.test.date)):'Not set'}</span></div><button class="btn" id="sTest">${icon(state.test?'edit':'plus',16)} ${state.test?'Change':'Add test date'}</button></div>
    <div class="set"><div><b>Month start date</b><span class="sub">Month 1 starts on this date (4 weeks per month)</span></div><input class="input" id="sStart" type="date" value="${esc(state.start)}"></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <h3>Appearance</h3>
    <div class="set"><div><b>Theme</b><span class="sub">Light or dark</span></div>
      <div class="seg" id="sTheme"><button data-t="light" class="${state.theme==='light'?'on':''}">Light</button><button data-t="dark" class="${state.theme==='dark'?'on':''}">Dark</button></div></div>
    <div class="set"><div><b>Accent colour</b><span class="sub">Buttons, charts and highlights</span></div>
      <div class="swatches" id="sAccent">${ACCENTS.map(c=>`<button class="sw ${c===S.accent?'on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="set"><div><b>Date colours</b><span class="sub">Green is today, then yellow, orange and red as a date gets older</span></div>
      <div class="legend"><span><i class="dot" style="background:hsl(135 85% 50%)"></i>Today</span><span><i class="dot" style="background:hsl(50 85% 50%)"></i>1 day</span><span><i class="dot" style="background:hsl(32 85% 50%)"></i>2 days</span><span><i class="dot" style="background:hsl(20 85% 50%)"></i>3–5</span><span><i class="dot" style="background:hsl(0 85% 50%)"></i>6+</span></div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <h3>Data</h3>
    <div class="set"><div><b>Backup</b><span class="sub">Download your scores, words, notes, profile and posts as text. Attached files and photos are not included.</span></div><button class="btn" id="sExport">${icon('download',16)} Download backup</button></div>
    <div class="set"><div><b>Restore</b><span class="sub">Load a backup file (replaces current data)</span></div><button class="btn" id="sImport">${icon('upload',16)} Restore backup</button><input type="file" id="sFile" accept="application/json" hidden></div>
    <div class="set"><div><b>Get IELTS Tracker</b><span class="sub">Download a clean copy of the app (without your data) to share with friends</span></div><button class="btn" id="sApp">${icon('download',16)} Download app</button></div>
  </div>
  <div class="card">
    <h3>Danger zone</h3>
    <div class="set"><div><b>Clear my word list</b><span class="sub">Removes all your words and meanings</span></div><button class="btn danger" id="sClearWords">Clear words</button></div>
    <div class="set"><div><b>Reset everything</b><span class="sub">Deletes all data in this browser</span></div><button class="btn danger" id="sReset">Reset all</button></div>
  </div>`;
  const num = (v,min,max,def) => { v = parseInt(v,10); return isNaN(v) ? def : Math.max(min,Math.min(max,v)); };
  $('sName').oninput = e => { state.profile.name = e.target.value; save(); refreshChrome(); };
  $('sGoal').oninput = e => { S.wordGoal = num(e.target.value,1,500,10); save(); };
  $('sTarget').oninput = e => { S.wordTarget = num(e.target.value,1,20000,8000); save(); };
  $('sTest').onclick = showTestModal;
  $('sStart').onchange = e => { if(e.target.value){ state.start = e.target.value; save(); buildDrawer(current,curMonth); } };
  $('sTheme').onclick = e => { const b = e.target.closest('button'); if(b) setTheme(b.dataset.t); };
  $('sAccent').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.accent = b.dataset.c; save(); applyLook(); viewSettings(el); };
  $('sExport').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    a.download = `ielts-backup-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('sApp').onclick = () => downloadText(trackerSource(), 'ielts-tracker.html');
  $('sImport').onclick = () => $('sFile').click();
  $('sFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(!confirm('Restoring will replace your current data. Continue?')) return;
    const r = new FileReader();
    r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.entries) throw 0;
        localStorage.setItem(KEY, JSON.stringify({...d,v2:true})); state = load(); applyLook(); render(); alert('Backup restored.');
      }catch(_){ alert('That file is not a valid backup.'); } };
    r.readAsText(f);
  };
  $('sClearWords').onclick = () => { if(confirm('Remove all your words and meanings?')){ state.words = []; save(); toast('Word list cleared'); } };
  $('sReset').onclick = () => { if(confirm('Delete ALL data in this browser? This cannot be undone.') && confirm('Really delete everything?')){
    FDB.clear().catch(()=>{}); localStorage.removeItem(KEY); state = load(); applyLook(); render(); } };
}

/* ================= start ================= */
applyLook();
render();
loadPfp().then(() => { if(pfpUrl){ applyLook(); render(); } });
</script>
